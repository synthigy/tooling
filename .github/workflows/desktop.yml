# Desktop: on a v* tag, build the Synthigy desktop app from desktop/ (compiled
# UI + Rust host, exported by the private repo) on macOS, Windows and Linux,
# and attach the installers to that tag's release.
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to build and attach to (e.g. v0.1.16)
        required: true
      publish:
        description: upload to the release (off = installers stay as run artifacts)
        type: boolean
        default: true
permissions:
  contents: write
env:
  TAG: ${{ inputs.tag || github.ref_name }}
jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ''
            rust-targets: ''
          - os: ubuntu-22.04
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          tauriScript: npx --yes @tauri-apps/cli@2
          args: ${{ matrix.args }}
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find desktop/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -exec cp {} out/ \;
          ls -la out
          test -n "$(ls out)"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: bundle
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: out
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum * > sha256sums-desktop.txt
          cat sha256sums-desktop.txt
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$REPO" --title "$TAG" --notes "" \
            || gh release view "$TAG" -R "$REPO" >/dev/null
          gh release upload "$TAG" * -R "$REPO" --clobber
