<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<meta name="referrer" content="no-referrer">
<title>Signed in · Synthigy Studio</title>
<style>
  :root { --bg:#f6f6f6; --card:#fff; --fg:#111; --m:#666; --line:#e2e2e2 }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --card:#1b1b1b; --fg:#eee; --m:#999; --line:#2c2c2c } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif }
  main { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 32px;
         max-width:360px; margin:16px; text-align:center }
  h1 { font-size:16px; margin:0 0 4px; letter-spacing:.02em }
  .k { font-size:11px; letter-spacing:.2em; color:var(--m); margin:0 0 14px }
  p { margin:8px 0 }
  .m { color:var(--m); font-size:12px }
  .btn { display:inline-block; margin-top:6px; padding:7px 14px; border-radius:7px; background:var(--fg);
         color:var(--bg); text-decoration:none; font-weight:600 }
  [hidden] { display:none }
</style>
<main>
  <p class="k">SYNTHIGY STUDIO</p>
  <h1>Signed in</h1>
  <p>You're signed in.</p>
  <p id="back" hidden><a class="btn" id="open">Return to Synthigy Studio</a></p>
  <p class="m">You can close this tab.</p>
</main>
<script>
  const scheme = new URLSearchParams(location.search).get("scheme");
  if (scheme === "synthigy" || scheme === "synthigy-dev") {
    const link = scheme + "://signed-in";
    document.getElementById("open").href = link;
    document.getElementById("back").hidden = false;
    history.replaceState(null, "", location.pathname);
    location.replace(link);
  }
</script>
</html>
